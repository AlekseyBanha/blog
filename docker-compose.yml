services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: evo_app
    working_dir: /var/www/html
    environment:
      EVO_VERSION: 3.5.x-dev
      COMPOSER_PROCESS_TIMEOUT: 600
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:-evolution}
      DB_USERNAME: ${DB_USERNAME:-evolution}
      DB_PASSWORD: ${DB_PASSWORD:-evolution_pass}
      DB_PREFIX: ${DB_PREFIX:-k6on_}
    healthcheck:
      test:
        - CMD
        - php
        - -r
        - "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"
      interval: 10s
      timeout: 3s
      retries: 90
      start_period: 5m
    volumes:
      - ./src:/var/www/html
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    container_name: evo_nginx
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: evo_db
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_pass}
      MYSQL_DATABASE: ${DB_DATABASE:-evolution}
      MYSQL_USER: ${DB_USERNAME:-evolution}
      MYSQL_PASSWORD: ${DB_PASSWORD:-evolution_pass}
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - db_data:/var/lib/mysql
      # Auto-import blog snapshot on first container init (empty volume only)
      - ./database.sql:/docker-entrypoint-initdb.d/01-database.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  phpmyadmin:
    image: phpmyadmin:5-apache
    container_name: evo_phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: ${DB_HOST:-db}
      PMA_PORT: ${DB_PORT:-3306}
      PMA_USER: root
      PMA_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_pass}
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
