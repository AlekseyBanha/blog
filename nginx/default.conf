server {
    listen 80;
    server_name localhost;
    root /var/www/html;
    index index.php index.html;
    absolute_redirect off;
    port_in_redirect off;

    location = /install {
        return 301 /install/;
    }

    location /install/ {
        try_files $uri $uri/ /install/index.php?$query_string;
    }

    location ~ ^/install/.*\.php$ {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param SERVER_PORT 8080;
        fastcgi_param HTTP_HOST $http_host;
        fastcgi_param REMOTE_ADDR 127.0.0.1;
        fastcgi_param HTTP_X_FORWARDED_FOR 127.0.0.1;
    }

    location = /setup {
        return 302 /install/index.php;
    }

    location = /setup/ {
        return 302 /install/index.php;
    }

    # Front-end static assets (never include /manager)
    location ~* ^/(assets|css|js|images|fonts)/ {
        try_files $uri =404;
        expires 7d;
        access_log off;
    }

    location = /favicon.ico {
        try_files $uri =404;
        access_log off;
        log_not_found off;
    }

    # Keep /manager out of Friendly URL rewrite (@evolution)
    location = /manager {
        return 301 /manager/;
    }

    location = /manager/ {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $document_root/manager/index.php;
        fastcgi_param SCRIPT_NAME /manager/index.php;
        fastcgi_param DOCUMENT_URI /manager/index.php;
        fastcgi_param REQUEST_URI /manager/;
        fastcgi_param SERVER_PORT 8080;
        fastcgi_param HTTP_HOST $http_host;
        fastcgi_param REMOTE_ADDR 127.0.0.1;
        fastcgi_param HTTP_X_FORWARDED_FOR 127.0.0.1;
    }

    location /manager/ {
        try_files $uri $uri/ /manager/index.php?$query_string;
    }

    location / {
        try_files $uri $uri/ @evolution;
    }

    location @evolution {
        rewrite ^/(.*)$ /index.php?q=$1 last;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param SERVER_PORT 8080;
        fastcgi_param HTTP_HOST $http_host;
        fastcgi_param REMOTE_ADDR 127.0.0.1;
        fastcgi_param HTTP_X_FORWARDED_FOR 127.0.0.1;
    }

    location ~ /\.ht {
        deny all;
    }
}
